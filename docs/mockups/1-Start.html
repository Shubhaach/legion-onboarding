<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web 1 Get started</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:#2B47D6}a:hover{color:#1A2F9E}
.brand{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#0B0B0C}
.eb{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#2B47D6}
.h1{margin:0;font-size:40px;line-height:1.15;font-weight:500;letter-spacing:-.02em}
.sub{margin:0;font-size:17px;line-height:1.55;color:#55555C}
.card{border:1px solid #E4E4E7;border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:13px;color:#55555C}
.src{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;background:#EEF1FD;color:#2236A8;padding:3px 6px;border-radius:4px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 30px;border:0;border-radius:26px;background:#2B47D6;color:#fff;font-family:inherit;font-size:16px;font-weight:600}
.fl{display:flex;flex-direction:column;gap:8px;font-size:14px;color:#55555C}
.in{height:52px;box-sizing:border-box;border:1px solid #D4D4D8;border-radius:12px;padding:0 16px;font-family:inherit;font-size:17px;color:#0B0B0C;width:100%}
</style>
</helmet>
<div style="min-height: 900px; background: #FFFFFF; font-family: 'Inter', system-ui, sans-serif; color: #0B0B0C; display: flex; flex-direction: column">
  <header style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap; padding: 18px 40px; border-bottom: 1px solid #EEEEF0">
    <span class="brand" style="flex: 1 1 160px">Legion Health</span>
    <div style="flex: 0 1 360px; display: flex; align-items: center; gap: 12px">
      <div style="flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
        <div style="height: 4px; border-radius: 2px; background: #2B47D6"></div>
        <div style="height: 4px; border-radius: 2px; background: #E4E4E7"></div>
        <div style="height: 4px; border-radius: 2px; background: #E4E4E7"></div>
        <div style="height: 4px; border-radius: 2px; background: #E4E4E7"></div>
        <div style="height: 4px; border-radius: 2px; background: #E4E4E7"></div>
        <div style="height: 4px; border-radius: 2px; background: #E4E4E7"></div>
        <div style="height: 4px; border-radius: 2px; background: #E4E4E7"></div>
      </div>
      <span class="lbl" style="white-space: nowrap">1 of 7</span>
    </div>
    <div style="flex: 1 1 160px; display: flex; justify-content: flex-end"><a href="#" class="lbl" style="text-decoration: none">Need help?</a></div>
  </header>
  <main style="flex: 1; width: 100%; max-width: 640px; margin: 0 auto; box-sizing: border-box; padding: 88px 24px 64px; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <span class="eb">Get started</span>
      <h1 class="h1">Let's get you seen by a provider</h1>
      <p class="sub">Two details. We fill in the rest.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px">
      <label class="fl">Mobile number<input class="in" value="(512) 555-0142" readonly="readonly"></label>
      <label class="fl">Date of birth<input class="in" value="03 / 14 / 1992" readonly="readonly"></label>
    </div>
    <div class="card" style="background: #F7F8FC; border-color: #E1E5F5">
      <label style="display: flex; gap: 12px; align-items: flex-start; font-size: 15px; line-height: 1.5">
        <input type="checkbox" checked="checked" readonly="readonly" style="width: 20px; height: 20px; margin: 2px 0 0; accent-color: #2B47D6; flex: none">
        <span>Let Legion pull my insurance, records and medication history to fill this in for me.</span>
      </label>
    </div>
    <div style="display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin-top: 8px">
      <button class="btn" type="button">Text me a code <svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <span class="lbl">Already have an account? <a href="#">Sign in</a></span>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
